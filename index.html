<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Férias · Usinagem</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#0066B3;--azul-esc:#003D71;--claro:#00A0DC;--bg:#EEF3F8;--card:#fff;--borda:#E2E8F0;--linha:#EEF2F6;--txt:#1C2B3A;--mut:#6B7C8D;
  --ok:#1E8449;--ok-bg:#D5F5E3;--ok-tx:#145A32;--warn:#B7791F;--warn-bg:#FEF3C7;--warn-tx:#7A4F01;--bad:#C0392B;--bad-bg:#FDEDEC;--bad-tx:#7B241C;
  --cinza:#B8C2CC;--fs:#F4F6F9;--cab:#F8FAFC;--grp:#EAF2FB;--colbg:#DCEBF8;--azul-bg:#E8F1FA;--azul-tx:#003D71;--sombra:0 1px 2px rgba(16,40,70,.06),0 6px 18px rgba(16,40,70,.06);
  --pend:repeating-linear-gradient(45deg,#F6C453,#F6C453 4px,#FBE3A1 4px,#FBE3A1 8px)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1621;--card:#16212E;--borda:#263445;--linha:#1F2B3A;--txt:#E6EDF5;--mut:#93A3B5;
  --ok:#2EA866;--ok-bg:#123524;--ok-tx:#8FE0B2;--warn-bg:#3A2E10;--warn-tx:#F6D58A;--bad:#E25C4D;--bad-bg:#3A1A18;--bad-tx:#F4B1A9;
  --cinza:#4F5F71;--fs:#1A2633;--cab:#1A2633;--grp:#1B2C40;--colbg:#1D3550;--azul-bg:#1B2C40;--azul-tx:#9CCBF0;--sombra:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Poppins,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:13px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.topo{background:radial-gradient(1200px 300px at 85% -60%,rgba(0,160,220,.55),transparent 60%),linear-gradient(135deg,#00274A,var(--azul-esc) 40%,var(--azul));color:#fff;padding:16px 20px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:14px;min-width:0}
.marca .lg{height:34px;width:auto;flex:none;filter:drop-shadow(0 1px 4px rgba(0,0,0,.35))}
.marca .tit{padding-left:14px;border-left:1px solid rgba(255,255,255,.28);min-width:0}
.topo h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em} .topo .sub{font-size:11.5px;opacity:.8}
.atual{margin-left:auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);border-radius:20px;padding:5px 12px 5px 10px;font-size:11.5px;display:flex;align-items:center;gap:7px}
.atual .tv{width:15px;height:15px;color:#fff;flex:none} .atual b{font-weight:600;white-space:nowrap}
.atual .elo svg{display:block} .atual .elo line{stroke:#4ADE80;stroke-width:2;stroke-dasharray:3 3;animation:fluxo .6s linear infinite}
.atual .ok{width:14px;height:14px;color:#4ADE80;flex:none;border-radius:50%;animation:pulso 2.2s infinite}
.atual .txt{opacity:.9;padding-left:7px;border-left:1px solid rgba(255,255,255,.25)}
.atual[data-tip]{cursor:help} #tip .tip-eq{border-collapse:collapse;margin:6px 0 4px;font-size:12px} #tip .tip-eq td{padding:2px 10px 2px 0;white-space:nowrap}
.atual.velho{background:#FEF3C7;color:#7A4F01;border-color:#F6C453} .atual.velho .tv{color:#7A4F01} .atual.velho .elo line{stroke:#E0A100;animation:none} .atual.velho .ok{color:#E0A100;animation:none} .atual.velho .txt{border-color:rgba(122,79,1,.3)}
@keyframes fluxo{to{stroke-dashoffset:-12}}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.ferr{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--borda)}
.ferr .in{max-width:1500px;margin:0 auto;padding:10px 20px;display:flex;flex-direction:column;gap:8px}
.l1,.l2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.abas{display:flex;background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:3px;gap:2px;box-shadow:var(--sombra)}
.abas button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.abas button svg{width:15px;height:15px;flex:none}
.abas button.on{background:var(--azul);color:#fff;box-shadow:0 2px 8px rgba(0,102,179,.35)}
.nav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:3px;box-shadow:var(--sombra)}
.nav button{border:0;background:none;width:34px;height:32px;border-radius:9px;cursor:pointer;font-size:18px;color:var(--azul);line-height:1} .nav button:hover{background:var(--azul-bg)}
.nav .tit{width:auto;min-width:150px;font-size:14px;font-weight:700;color:var(--txt);padding:0 8px;line-height:1.1}
.nav .tit small{display:block;font-size:9.5px;font-weight:600;color:var(--claro)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;max-width:100%} .chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--borda);background:var(--card);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:12px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:6px;transition:all .15s}
.chip .pt{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--txt);border-color:var(--txt);color:var(--card)}
.busca{position:relative;flex:1;min-width:180px;max-width:320px}
.busca input{width:100%;border:1.5px solid var(--borda);background:var(--card);color:var(--txt);border-radius:10px;padding:8px 10px 8px 32px;font:inherit;font-size:12.5px;outline:none}
.busca input:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,102,179,.15)}
.busca svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mut)}
.busca input{padding-right:32px} .busca input::-webkit-search-cancel-button{display:none}
#bLimpa{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;border-radius:50%;background:var(--borda);color:var(--txt);font-size:11px;cursor:pointer;line-height:24px;padding:0}
#bLimpa:hover{background:var(--azul);color:#fff}
.achou{background:var(--card);border:1.5px solid var(--azul);border-radius:14px;padding:10px 12px;margin-bottom:12px;box-shadow:var(--sombra)}
.achou.nada{border-color:var(--borda);color:var(--mut);font-size:13px}
.achou .tt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600;margin-bottom:6px}
.achou .acs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.achou .ac{display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--borda);background:var(--bg,transparent);border-radius:10px;padding:7px 9px;cursor:pointer;font:inherit;color:var(--txt);min-width:0}
.achou .ac:hover{border-color:var(--azul);background:var(--colbg)}
.achou .ac .nm{flex:1;min-width:0;display:flex;flex-direction:column} .achou .ac .nm b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .achou .ac .nm small{font-size:11px;color:var(--mut)}
.achou .ac .qd{font-size:12px;font-weight:600;white-space:nowrap;color:var(--azul-tx)} .achou .ac .qd .sem{color:var(--mut);font-weight:500}
@media (max-width:760px){ .achou .acs{grid-template-columns:1fr} }
label.so{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);cursor:pointer;white-space:nowrap}
label.so .nb{display:none;min-width:17px;height:17px;padding:0 5px;border-radius:9px;font-size:10.5px;font-weight:700;line-height:17px;text-align:center;color:#fff;margin-left:-2px}
label.so .nb.bad{display:inline-block;background:#d93a3a} label.so .nb.warn{display:inline-block;background:#e0912b}
.wrap{padding:16px 20px;max-width:1500px;margin:0 auto}
#conteudo{min-height:50vh}
.entra{animation:entra .35s ease both} @keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:12px 14px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--azul)}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em} .kpi .l{font-size:10.5px;text-transform:uppercase;color:var(--mut);letter-spacing:.04em;font-weight:600}
.kpi.bad:before{background:var(--bad)} .kpi.bad .v{color:var(--bad)} .kpi.warn:before{background:#F6C453} .kpi.ok:before{background:var(--ok)}
.caixa{border-radius:12px;padding:10px 14px;margin-bottom:10px;border:1px solid;line-height:1.55}
.alertas{background:var(--card);border:1px solid var(--borda);border-left:4px solid #F6C453;border-radius:12px;margin-bottom:10px;box-shadow:var(--sombra)} .alertas.bad{border-left-color:var(--bad)}
.alertas summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px;font-size:12.5px} .alertas summary::-webkit-details-marker{display:none}
.alertas summary .ic{color:var(--bad);font-size:14px} .alertas.warn summary .ic{color:#B7791F}
.alertas summary .abre{margin-left:auto;color:var(--azul);font-weight:600;font-size:12px;white-space:nowrap} .alertas summary .abre:after{content:" ▾"} .alertas[open] summary .abre:after{content:" ▴"}
.alertas summary:hover{background:var(--azul-bg);border-radius:12px}
.pz{font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap} .pz.bad{background:var(--bad-bg);color:var(--bad-tx)} .pz.warn{background:var(--warn-bg);color:var(--warn-tx)} .pz.col{background:var(--colbg);color:var(--azul-tx)}
.alertas .det{padding:0 12px 2px} .alertas .det .caixa{margin-bottom:10px}
@media (max-width:760px){.alertas summary{padding:7px 10px;gap:4px 5px;font-size:12px} .pz{font-size:10px;padding:1px 7px} .alertas summary .abre{font-size:11px}}
.resumo{font-size:12px;border-radius:10px;padding:7px 12px;margin-bottom:8px;display:inline-block;margin-right:6px} .resumo.ok{background:var(--ok-bg);color:var(--ok-tx)} .resumo.col{background:var(--colbg);color:var(--azul-tx)}
.caixa b.t{display:block;margin-bottom:3px} .caixa ul{margin:0;padding-left:18px;line-height:1.7}
.conf{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 35%,transparent);color:var(--bad-tx)}
.aviso{background:var(--warn-bg);border-color:color-mix(in srgb,#F6C453 60%,transparent);color:var(--warn-tx)}
.colet{background:var(--azul-bg);border-color:color-mix(in srgb,var(--azul) 30%,transparent);color:var(--azul-tx)}
.semconf{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 35%,transparent);color:var(--ok-tx)}
.mais{display:inline-block;margin-top:4px;font-weight:600;cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;color:inherit}
.grade{background:var(--card);border:1px solid var(--borda);border-radius:14px;overflow:auto;max-height:calc(100vh - 170px);min-height:280px;box-shadow:var(--sombra);overscroll-behavior:contain}
table{border-collapse:separate;border-spacing:0;width:100%}
.grade th,.grade td{padding:0;border-bottom:1px solid var(--linha);text-align:center;font-size:11px}
.grade thead th{position:sticky;top:0;background:var(--cab);z-index:3;padding:6px 0;font-weight:600;color:var(--mut);min-width:26px;cursor:pointer}
.grade thead th:hover{color:var(--azul)}
.grade thead th .ds{display:block;font-size:9px;font-weight:500}
.grade thead th.hj{color:#fff;background:var(--claro)} .grade thead th.col{background:var(--colbg);color:var(--azul-tx)}
.grade th.nome,.grade td.nome{position:sticky;left:0;background:var(--card);z-index:2;text-align:left;padding:6px 10px;min-width:220px;max-width:260px;border-right:1px solid var(--borda);cursor:default}
.grade thead th.nome{z-index:4;background:var(--cab)}
.grade tbody tr[data-acao]{cursor:pointer} .grade tbody tr[data-acao]:hover td{background-color:color-mix(in srgb,var(--azul) 6%,transparent)} .grade tbody tr[data-acao]:hover td.nome{background:var(--azul-bg)}
.pn{display:flex;align-items:center;gap:8px;min-width:0} .pn>div{min-width:0}
.pn .n{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pn .m{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
tr.grupo td{background:var(--grp)!important;font-weight:700;text-align:left!important;padding:8px 10px!important;font-size:12px!important;color:var(--azul-tx)}
tr.grupo td .gt{position:sticky;left:10px;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.lim{font-weight:600;font-size:11px;padding:2px 9px;border-radius:10px;background:var(--ok-bg);color:var(--ok-tx)}
.lim.estouro{background:var(--bad);color:#fff} .lim.atencao{background:var(--warn-bg);color:var(--warn-tx)} .lim.aut{background:var(--colbg);color:var(--azul-tx)}
.grade td.fs{background:var(--fs)} .grade td.hj{box-shadow:inset 2px 0 0 var(--claro),inset -2px 0 0 var(--claro)}
.grade td .b{display:block;height:18px;margin:4px 0;transform-origin:left;animation:barra .5s ease both}
@keyframes barra{from{transform:scaleX(0)}to{transform:none}}
.b.m{background:linear-gradient(180deg,color-mix(in srgb,var(--ct,var(--ok)) 82%,#fff),var(--ct,var(--ok)))} .b.p{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ct,var(--pend)) 55%,var(--card)) 0 4px,color-mix(in srgb,var(--ct,var(--pend)) 14%,var(--card)) 4px 8px);box-shadow:inset 0 0 0 2px var(--ct,var(--pend));border-top:0} .b.c{background:var(--cinza)}
.agr{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--borda);border-radius:20px;padding:2px;flex:none;font-size:12px}
.agr span{color:var(--mut);padding:0 6px 0 8px;font-size:11.5px} .agr button{border:0;background:none;border-radius:16px;padding:5px 11px;cursor:pointer;color:var(--mut);font-weight:600}
.agr button.on{background:var(--azul);color:#fff}
.mq{font-size:13px} .gt .dm{font-weight:500;opacity:.7;font-size:.92em;margin-left:-4px} .tts{display:inline-flex;gap:3px} .tts b{color:#fff;font-size:9.5px;border-radius:5px;padding:1px 6px;font-weight:700}
.aviso.info{background:var(--colbg);border:1px solid color-mix(in srgb,var(--azul) 25%,transparent);color:var(--azul-tx);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:12.5px}
.b.i{border-radius:6px 0 0 6px;margin-left:2px!important} .b.f{border-radius:0 6px 6px 0;margin-right:2px!important} .b.i.f{border-radius:6px}
.grade td.cf .b{box-shadow:inset 0 0 0 2px var(--bad);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.0) 0 3px,rgba(255,255,255,.45) 3px 5px);background-color:var(--bad)} .grade td.cf{background:var(--bad-bg);cursor:help}
.grade tr.fora td{background:var(--cab);border-bottom:2px solid var(--borda);height:24px} .grade tr.fora td.fs{background:color-mix(in srgb,var(--fs) 60%,var(--cab))}
.grade tr.fora td.nome{background:var(--cab)} .grade tr.fora .fr{font-size:10.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.nf{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:6px;font-size:10.5px;font-weight:700;cursor:help}
.nf.n1{background:var(--ok-bg);color:var(--ok-tx)} .nf.n2{background:#F6C453;color:#5C3B00} .nf.n3{background:var(--bad);color:#fff} .nf.col{background:var(--colbg);color:var(--azul-tx)}
.regua{display:flex;gap:1px;margin-top:2px;height:10px} .regua span{flex:1;font-size:8px;line-height:10px;color:var(--mut);text-align:left;overflow:visible;white-space:nowrap}
.lin{display:flex;align-items:center;gap:6px;margin-top:4px} .lin.eu{margin-top:10px} .lin .tira,.lin .regua{flex:1;margin-top:0}
.lin .bd{flex:none;width:24px;height:12px;border-radius:4px;font-size:8px;font-weight:700;line-height:12px;text-align:center;color:#fff;letter-spacing:.02em}
.lin.mini{margin-top:3px;border-radius:4px;cursor:help} .lin.mini .tira{height:8px} .lin.mini .bd{height:10px;line-height:10px;font-size:7.5px;opacity:.9}
.lin.mini:hover .tira{outline:1.5px solid var(--azul);outline-offset:1px;border-radius:2px} .lin.livre .tira{opacity:.7}
.lin .regua{margin-top:1px}
.sob{margin-top:4px;font-size:10.5px;color:var(--mut);text-align:left;padding-left:30px}
/* barras empilhadas na cor do turno; sobreposição: vermelho (mesma máquina) e amarelo (mesmo turno) */
.lin .tira i.m{background:var(--ct)} .lin .tira i.p{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ct) 55%,var(--card)) 0 3px,color-mix(in srgb,var(--ct) 14%,var(--card)) 3px 6px);box-shadow:inset 0 0 0 1.5px var(--ct)}
.lin .tira i.o{background:color-mix(in srgb,var(--ct) 55%,var(--card))} .lin .tira i.cf{background:var(--bad);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)} .tira i.tu{background:#F6C453;box-shadow:inset 0 0 0 1px rgba(120,80,0,.35)}
#tip{position:fixed;z-index:60;max-width:270px;background:var(--card);color:var(--txt);border:1px solid var(--borda);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.45;box-shadow:0 12px 32px rgba(0,30,60,.22);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;text-align:left}
#tip.on{opacity:1;transform:none} #tip b{display:block;font-size:12.5px} #tip small{display:block;color:var(--mut);font-size:11px;margin-bottom:5px}
#tip .r{color:var(--bad);font-weight:600} #tip .a{color:#9A6700;font-weight:600} #tip .v{color:var(--ok-tx);font-weight:600}
.tag{font-size:10px;padding:1px 7px;border-radius:10px;background:var(--azul-bg);color:var(--azul);font-weight:600;margin-left:4px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin:10px 2px}
.leg i{display:inline-block;width:18px;height:10px;border-radius:3px;vertical-align:middle;margin-right:5px}
.vazio{padding:46px 20px;text-align:center;color:var(--mut)} .vazio .ic{font-size:34px;display:block;margin-bottom:6px}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;letter-spacing:.02em}
.av.g{width:52px;height:52px;font-size:18px}
.hero{border-radius:20px;padding:20px 22px;color:#fff;background:radial-gradient(600px 200px at 100% 0,rgba(0,160,220,.6),transparent 60%),linear-gradient(135deg,var(--azul-esc),var(--azul));box-shadow:0 10px 30px rgba(0,61,113,.25);margin-bottom:12px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:30px solid rgba(255,255,255,.06)}
.hero .d{font-size:12px;opacity:.85;font-weight:500}
.hero .big{display:flex;align-items:baseline;gap:10px;margin:4px 0 2px;flex-wrap:wrap} .hero .big b{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.03em} .hero .big span{font-size:15px;font-weight:600}
.hero .s{font-size:12px;opacity:.85}
.cob{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.cob button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);border-radius:12px;padding:7px 11px;cursor:pointer;color:#fff;text-align:left;min-width:92px}

/* planilha do mês: todos os dias cabem na largura (PC e celular), sem rolagem lateral; no celular dá zoom de pinça */
:root{--semimp:#F3F7FC;--semimp-cab:#E3EEF9;--sempar-cab:#FFF4DC;--fh:0px}

.plan{background:var(--card);border:1px solid var(--borda);border-radius:14px;box-shadow:var(--sombra)}

.plan td.hj{box-shadow:inset 2px 0 0 var(--claro),inset -2px 0 0 var(--claro)}

.plan td.v{cursor:help}
.plan td.v.m{background:var(--ct)} .plan td.v.p{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ct) 55%,var(--card)) 0 3px,color-mix(in srgb,var(--ct) 14%,var(--card)) 3px 6px);box-shadow:inset 0 0 0 2px var(--ct)} .plan td.v.c{background:var(--cinza)}

// </fabrica>

  else if (a === 'agrupar') { agrupar = v; try { localStorage.setItem('calFeriasAgrupar', v); } catch (x) {} render(true); }
  else if (a === 'turno') { turnoSel = turnoSel === v ? '' : v; render(); }

});
var tBusca; document.getElementById('busca').addEventListener('input', function () { var v = this.value; clearTimeout(tBusca); tBusca = setTimeout(function () { busca = v; render(); }, 120); });
function limparBusca() { var i = document.getElementById('busca'); i.value = ''; busca = ''; render(); }
document.getElementById('bLimpa').addEventListener('click', function () { limparBusca(); document.getElementById('busca').focus(); });

document.getElementById('so').addEventListener('change', function () { so = this.checked; try { localStorage.setItem('calFeriasSo', so ? '1' : '0'); } catch (x) {} render(); });
document.getElementById('av').addEventListener('change', function () { mostrarAv = avAberto = this.checked; try { localStorage.setItem('calFeriasAv', mostrarAv ? '1' : '0'); } catch (x) {} render(); });
document.addEventListener('keydown', function (e) {

// deslizar para os lados troca o mês (fora da grade e da tabela do ano, que rolam sozinhas)

cont.addEventListener('touchstart', function (e) { if (e.touches.length > 1 || e.target.closest('.grade') || e.target.closest('.anual table')) { tx = null; return; } tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
cont.addEventListener('touchend', function (e) {

  if (Math.abs(dx) > 70 && Math.abs(dy) < 50) mudar(dx < 0 ? 1 : -1);

<div id="appAviso" role="status"></div>
<script>
// ===== app instalável: busca os dados na planilha (mesmos dados do link do calendário) =====
(function () {
  var FONTE = "https://script.google.com/macros/s/AKfycbwFAQRTFft_gdsHU1aOnKAsRvsBAKdjW17awDg-K8lDel8uUahBp64wwfd2pfuorGA2WA/exec", CH = 'calFeriasAppDados', inicio = Date.now(), rodou = false;
  var cont = document.getElementById('conteudo');
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});

  function guardado() { try { var c = localStorage.getItem(CH); return c ? JSON.parse(c) : null; } catch (e) { return null; } }
  function guardar(d) { try { localStorage.setItem(CH, JSON.stringify(d)); } catch (e) {} }
  // o que importa comparar (o "gerado" muda a cada pedido)
  function chave(d) { var x = {}; for (var k in d) if (k !== 'gerado') x[k] = d[k]; return JSON.stringify(x); }
  function quando(s) { var q = new Date(s); return isNaN(q) ? '' : q.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' às ' + q.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }

  var tAv;
  window.appAviso = function (html, botoes, fica) {
    var a = document.getElementById('appAviso'); clearTimeout(tAv);
    a.innerHTML = '<span>' + html + '</span>' + (botoes || '');
    a.classList.add('on'); if (!fica) tAv = setTimeout(function () { a.classList.remove('on'); }, 5000);
  };
  document.getElementById('appAviso').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var ac = b.getAttribute('data-ap'); this.classList.remove('on');
    if (ac === 'recarregar') recarregar();
    else if (ac === 'instalar' && window.appPedido) { window.appPedido.prompt(); window.appPedido = null; }
    else if (ac === 'nao') { try { localStorage.setItem('calFeriasAppNaoInstalar', String(Date.now())); } catch (x) {} }
  });

  // roda o calendário (o mesmo código do link do Google) com os dados
  function rodar(d) {
    rodou = true; window.__D = JSON.parse(JSON.stringify(d)); // cópia: o calendário mexe nos dados ao montar a tela
    var s = document.createElement('script'); s.text = document.getElementById('appCal').text; document.body.appendChild(s);
    var y = +sessionStorage.getItem('calFeriasAppY'); if (y) { sessionStorage.removeItem('calFeriasAppY'); window.scrollTo(0, y); }
  }
  // dados novos com o app aberto: troca a tela sem perder o lugar (só se a pessoa não estiver com um detalhe aberto)
  function recarregar() {
    if (document.getElementById('veu').classList.contains('on') || /input/i.test((document.activeElement || {}).tagName)) {
      appAviso('<b>Tem dados novos</b>', '<button data-ap="recarregar">Atualizar</button>', true); return;
    }
    try { sessionStorage.setItem('calFeriasAppY', String(window.scrollY)); } catch (e) {}
    location.reload();
  }
  function buscar() {
    var ctl = window.AbortController ? new AbortController() : null, t = ctl && setTimeout(function () { ctl.abort(); }, 20000);
    return fetch(FONTE + '?formato=json', { cache: 'no-store', signal: ctl && ctl.signal })
      .then(function (r) { clearTimeout(t); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { if (!d || !d.pessoas) throw new Error('resposta sem dados'); return d; });
  }

  var velho = guardado();
  if (velho) rodar(velho);   // abre na hora com o que já está no aparelho
  else cont.innerHTML = '<div id="appCarrega"><i></i>Carregando o calendário…</div>';
  function atualizar(silencioso) {
    return buscar().then(function (d) {
      var mudou = !velho || chave(d) !== chave(velho);
      guardar(d);
      if (!rodou) rodar(d); else if (mudou) recarregar();
      velho = d; inicio = Date.now();
    }).catch(function () {
      if (!rodou) cont.innerHTML = '<div id="appCarrega">Sem conexão com a planilha.<br>Confira a internet e tente de novo.<button onclick="location.reload()" style="margin-top:10px;border:0;border-radius:999px;padding:8px 16px;background:var(--azul);color:#fff;font-weight:600">Tentar de novo</button></div>';
      else if (!silencioso) appAviso('<b>Sem internet</b> · mostrando os dados de ' + quando(velho && velho.gerado));
    });
  }
  atualizar(false);
  // voltou para o app depois de um tempo: confere se tem novidade
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && Date.now() - inicio > 10 * 60e3) atualizar(true); });
  window.addEventListener('online', function () { atualizar(true); });

  // instalar: discreto, uma vez; se a pessoa disser "agora não", some por 30 dias
  var sa = window.matchMedia && matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  var naoAte = 0; try { naoAte = +localStorage.getItem('calFeriasAppNaoInstalar') + 30 * 864e5; } catch (e) {}
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); window.appPedido = e; if (sa || Date.now() < naoAte) return;
    setTimeout(function () { appAviso('📲 <b>Instalar o calendário</b> no celular?', '<button data-ap="instalar">Instalar</button><button class="x" data-ap="nao" aria-label="Agora não">✕</button>', true); }, 2500);
  });
  // iPhone: o Safari não mostra o botão de instalar; uma dica, uma vez
  if (!sa && /iphone|ipad|ipod/i.test(navigator.userAgent) && Date.now() >= naoAte)
    setTimeout(function () { appAviso('📲 Para instalar: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>', '<button class="x" data-ap="nao" aria-label="Fechar">✕</button>', true); }, 2500);
})();
</script>
